// android/build.gradle

buildscript {
    repositories {
        google()  // Repositório do Google
        mavenCentral()  // Repositório Maven
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.0.4'  // Versão do plugin do Gradle para Android
        classpath 'com.google.gms:google-services:4.3.10'  // Plugin do Google Services
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.5.21'  // Plugin Kotlin
    }
}

allprojects {
    repositories {
        google()  // Repositório do Google
        mavenCentral()  // Repositório Maven
    }
}
